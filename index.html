<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯美極簡五子棋 | Zen Gomoku</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="game-container">
        <header class="game-header">
            <h1>五子棋 <span class="subtitle">Gomoku</span></h1>
            <div class="status-board" id="statusBoard">
                <div class="player-indicator black active" id="playerBlack">
                    <div class="piece-icon black"></div>
                    <span>黑方 (Black)</span>
                </div>
                <div class="vs">VS</div>
                <div class="player-indicator white" id="playerWhite">
                    <div class="piece-icon white"></div>
                    <span>白方 (White)</span>
                </div>
            </div>
            <div id="gameMessage" class="game-message">黑方請下子</div>
        </header>

        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- Grid cells will be generated by JS -->
            </div>
        </div>

        <div class="controls">
            <button id="restartBtn" class="btn-glass">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 1 20.49 15"></path>
                </svg>
                重新開始 (Restart)
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
